[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "userapi"
version = "1.0.0"
description = "A drop-in Telegram Bot API replacement powered by Telethon and FastAPI for real user accounts."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Amir Hossein" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "telethon>=1.36.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "pysocks>=1.7.1",
    "python-socks>=2.5.0",
    "aiofiles>=24.1.0",
    "httpx[socks]>=0.27.0",
    "socksio>=1.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
